version: 2

models:
    - name: stg_customers
      columns:
        - name: customer_id
          data_tests: 
                - not_null
                - unique
        - name: email
          data_tests: 
                - dbt_utils.expression_is_true:
                    expression: " <> '' and upper(email) <> 'N/A'"
        - name: country_code
          data_tests:
                - relationships:
                    arguments:
                        to: ref('country_region_map')
                        field: country_code
    - name : stg_products
      columns:
        - name: product_id
          data_tests:
                - not_null
                - unique
        - name: category
          data_tests:
                - not_null:
                    config:
                        severity: warn
        - name: unit_cost
          data_tests:
                - is_neg_number

        - name: unit_price
          data_tests:
                - is_neg_number
    - name: stg_stores
      columns :
        - name: store_id
          data_tests:
                - not_null
                - unique

                