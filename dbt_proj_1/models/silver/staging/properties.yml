version: 2

models:
    - name: stg_customers
      columns:
        - name: customer_id
          data_tests: 
                - not_null
                - unique
        - name: email
          data_tests: 
                - dbt_utils.expression_is_true:
                    expression: " <> '' and upper(email) <> 'N/A'"
        - name: country_code
          data_tests:
                - relationships:
                    arguments:
                        to: ref('country_region_map')
                        field: country_code
    - name : stg_products
      columns:
        - name: product_id
          data_tests:
                - not_null
                - unique
        - name: category
          data_tests:
                - not_null:
                    config:
                        severity: warn
        - name: unit_cost
          data_tests:
                - is_neg_number

        - name: unit_price
          data_tests:
                - is_neg_number
    - name: stg_stores
      columns :
        - name: store_id
          data_tests:
                - not_null
                - unique
    - name: stg_orders
      columns:
        - name: order_id
          data_tests:
                - not_null
                - unique
        - name: status
          data_tests:
                - relationships:
                    arguments:
                        to: ref('order_status_map')
                        field: clean_status

        - name: customer_id
          data_tests:
                - relationships:
                    arguments:
                        to: ref('stg_customers')
                        field: customer_id
        - name: store_id
          data_tests:
                - relationships:
                    arguments:
                        to: ref('stg_stores')
                        field: store_id
                    config:
                        severity: warn
        - name: ship_date
          data_tests:
                - date_not_before:
                    compare_column: order_date
    - name: stg_order_items
      columns:
        - name: order_id
          data_tests:
                - relationships:
                    arguments:
                        to: ref('stg_orders')
                        field: order_id
        - name: product_id
          data_tests:
                - relationships:
                    arguments:
                        to: ref('stg_products')
                        field: product_id
        - name: quantity
          data_tests:
                - not_null
                - is_neg_number
        - name: unit_price
          data_tests:
                - not_null
                - is_neg_number
