bundle:
  name: dbt_poc_load_bronze
  databricks_cli_version: '>= 0.218.0'

include:
  - resources/*.yml

sync:
  exclude:
    - landing_files/**

variables:
  catalog:
    description: Unity Catalog catalog for the environment
  control_schema:
    default: control
  bronze_schema:
    default: bronze
  notify_email:
    description: Owner / failure-notification email (set BUNDLE_VAR_notify_email, see .env.example)
    default: you@example.com

# Workspace host is not stored here. Set DATABRICKS_HOST (see .env.example)
# or use a Databricks CLI profile (databricks auth login).
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dbt_project1_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: "<PROD-SERVICE-PRINCIPAL-APPLICATION-ID>"
    permissions:
      - user_name: ${var.notify_email}
        level: CAN_MANAGE
    variables:
      catalog: dbt_project1_prod
    resources:
      jobs:
        load_bronze_job:
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"
            timezone_id: Asia/Kolkata
            pause_status: UNPAUSED
          email_notifications:
            on_failure:
              - ${var.notify_email}
